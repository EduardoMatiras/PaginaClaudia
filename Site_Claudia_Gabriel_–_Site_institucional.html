  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

" style=\"text-decoration: none; padding: 12px 0; color: #2f3b3b\">Contato<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"topo\" style=\"max-width: 1160px; margin: 0 auto; padding: clamp(40px, 6vw, 80px) 24px clamp(56px, 7vw, 96px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px 72px; align-items: center\">\n<div style=\"flex: 999 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 24px; align-items: flex-start\">\n<h1 style=\"margin: 0; font-weight: 200; font-size: clamp(38px, 5vw, 66px); line-height: 1.08; letter-spacing: -0.01em\">Sua dor não precisa ser vivida <strong style=\"font-weight: 800\">em silêncio<\u002Fstrong>.<\u002Fh1>\n<p style=\"margin: 0; max-width: 540px\">Um espaço <strong style=\"font-weight: 600\">seguro, acolhedor e livre de julgamentos<\u002Fstrong> para quem perdeu alguém ou algo importante e sente que a vida ainda não voltou ao lugar.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; max-width: 520px; font-size: 16px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Atendimento <strong style=\"font-weight: 600\">individual<\u002Fstrong>, que respeita seu tempo e seu processo.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Práticas <strong style=\"font-weight: 600\">baseadas em evidências<\u002Fstrong>, pela Terapia Cognitivo-Comportamental.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Especialização em <strong style=\"font-weight: 600\">luto e perdas<\u002Fstrong>.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<div style=\"display: flex; flex-direction: column; gap: 10px; align-items: center; padding-top: 6px\">\n<a href=\"#contato\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 54px; min-width: 280px; padding: 0 36px; box-sizing: border-box; background: #516d75; color: #f6f1eb; text-decoration: none; border-radius: 999px; font-weight: 400; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase\">Quero saber mais<\u002Fa>\n<div style=\"font-size: 13.5px; color: #445252\">[Atendimento online e presencial]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; max-width: 460px; aspect-ratio: 4 / 5; background: #decfc2; border-radius: 24px 24px 180px 24px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; color: #445252; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase\">[Foto principal da Claudia]<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px clamp(64px, 8vw, 110px); box-sizing: border-box\">\n<div style=\"background: #fbf8f4; border: 1px solid #e3d9cd; border-radius: 28px; padding: clamp(36px, 5vw, 64px) clamp(20px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; align-items: center\">\n<div style=\"max-width: 660px; display: flex; flex-direction: column; gap: 16px; text-align: center\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.15\">Talvez você sinta que o mundo <strong style=\"font-weight: 800\">seguiu sem você<\u002Fstrong>.<\u002Fh2>\n<p style=\"margin: 0\">Por fora, a rotina continua. Por dentro, a perda ainda ocupa tudo. Não existe jeito certo de viver o luto, nem prazo para ele acabar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n<div style=\"background: #516d75; color: #f6f1eb; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #f6f1eb; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#445252\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20C4 11 10 5 20 4c0 10-6 16-16 16z\"><\u002Fpath><path d=\"M4 20l9-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15.5px\">Com uma saudade que não diminui.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #a8b89e; color: #2f3b3b; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #f6f1eb; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#445252\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20C4 11 10 5 20 4c0 10-6 16-16 16z\"><\u002Fpath><path d=\"M4 20l9-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15.5px\">Com culpa pelo que foi dito ou deixou de ser.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #decfc2; color: #2f3b3b; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #f6f1eb; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#445252\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20C4 11 10 5 20 4c0 10-6 16-16 16z\"><\u002Fpath><path d=\"M4 20l9-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15.5px\">Sob a pressa dos outros para você ficar bem.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #516d75; color: #f6f1eb; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #f6f1eb; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#445252\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20C4 11 10 5 20 4c0 10-6 16-16 16z\"><\u002Fpath><path d=\"M4 20l9-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15.5px\">Evitando o assunto para não preocupar ninguém.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #a8b89e; color: #2f3b3b; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #f6f1eb; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#445252\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20C4 11 10 5 20 4c0 10-6 16-16 16z\"><\u002Fpath><path d=\"M4 20l9-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<p style=\"margin: 0; font-size: 15.5px\">Vivendo uma perda que ninguém parece ver.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sobre\" style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px clamp(64px, 8vw, 110px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px 80px; align-items: center\">\n<div style=\"flex: 1 1 340px; max-width: 480px; position: relative; padding-bottom: 6%; box-sizing: border-box\">\n<div style=\"width: 76%; aspect-ratio: 4 / 5.4; background: #decfc2; border-radius: 22px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; color: #445252; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase\">[Foto 1]<\u002Fdiv>\n<div style=\"position: absolute; right: 0; bottom: 0; width: 42%; aspect-ratio: 3 / 4.2; background: #a8b89e; border: 6px solid #f6f1eb; border-radius: 22px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; box-sizing: border-box; color: #2f3b3b; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase\">[Foto 2]<\u002Fdiv>\n<div style=\"position: absolute; right: 0; top: 6%; width: 46%; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px\">\n<div style=\"background: #516d75; color: #f6f1eb; border-radius: 14px; padding: 9px 16px\">Psicóloga clínica<\u002Fdiv>\n<div style=\"background: #445252; color: #f6f1eb; border-radius: 14px; padding: 9px 16px\">Especialista em luto e perdas<\u002Fdiv>\n<div style=\"background: #a8b89e; color: #2f3b3b; border-radius: 14px; padding: 9px 16px\">Terapia Cognitivo-Comportamental<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.15\">Sobre <strong style=\"font-weight: 800\">mim<\u002Fstrong><\u002Fh2>\n<p style=\"margin: 0; font-weight: 600\">Um lugar onde a sua perda pode ser dita.<\u002Fp>\n<p style=\"margin: 0\">Sou Claudia Gabriel, psicóloga clínica. Trabalho com pessoas que vivem um luto ou uma perda significativa.<\u002Fp>\n<p style=\"margin: 0\">[Duas ou três frases da Claudia: formação, o que a levou ao tema do luto e o que percebeu ao longo da atuação.]<\u002Fp>\n<p style=\"margin: 0\">Meu trabalho une a ciência da Terapia Cognitivo-Comportamental a um olhar humano. Cada história é única e merece ser ouvida com respeito e cuidado.<\u002Fp>\n<div style=\"font-size: 15px; color: #445252\">CRP [00/00000] · [X] anos de experiência<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px clamp(64px, 8vw, 110px); box-sizing: border-box\">\n<div style=\"background: #fbf8f4; border: 1px solid #e3d9cd; border-radius: 28px; padding: clamp(36px, 5vw, 64px) clamp(24px, 5vw, 72px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: center\">\n<div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.15\">Como posso <strong style=\"font-weight: 800\">ajudar<\u002Fstrong><\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 10px; align-items: center\">\n<a href=\"#contato\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 54px; min-width: 280px; padding: 0 36px; box-sizing: border-box; background: #516d75; color: #f6f1eb; text-decoration: none; border-radius: 999px; font-weight: 400; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase\">Vamos conversar?<\u002Fa>\n<div style=\"font-size: 13.5px; color: #445252\">[Atendimento online e presencial]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul style=\"flex: 999 1 380px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 16px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span><strong style=\"font-weight: 600\">Compreender<\u002Fstrong> as reações do luto e por que elas vêm em ondas.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Olhar para a <strong style=\"font-weight: 600\">culpa<\u002Fstrong> e para os pensamentos que aumentam o sofrimento.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span><strong style=\"font-weight: 600\">Falar<\u002Fstrong> sobre quem partiu, em um espaço onde a lembrança é bem-vinda.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Atravessar <strong style=\"font-weight: 600\">datas difíceis<\u002Fstrong> e retomar a rotina aos poucos.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#516d75\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Encontrar novas formas de <strong style=\"font-weight: 600\">lembrar e honrar<\u002Fstrong>.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"atendimento\" style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px clamp(64px, 8vw, 110px); box-sizing: border-box; display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.15\">Como <strong style=\"font-weight: 800\">funciona<\u002Fstrong><\u002Fh2>\n<p style=\"margin: 0\">Começar pode ser mais simples do que parece.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<div style=\"background: #fbf8f4; border: 1px solid #e3d9cd; border-radius: 18px; padding: 24px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"flex: none; width: 56px; height: 56px; border-radius: 14px; background: #a8b89e; color: #2f3b3b; display: flex; align-items: center; justify-content: center; font-weight: 200; font-size: 26px\">01<\u002Fdiv>\n<div><h3 style=\"margin: 0; font-weight: 600; font-size: 16px\">Primeiro contato<\u002Fh3><p style=\"margin: 4px 0 0; font-size: 15px\">Você escreve pelo WhatsApp, conhece o atendimento e vê os horários.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #fbf8f4; border: 1px solid #e3d9cd; border-radius: 18px; padding: 24px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"flex: none; width: 56px; height: 56px; border-radius: 14px; background: #a8b89e; color: #2f3b3b; display: flex; align-items: center; justify-content: center; font-weight: 200; font-size: 26px\">02<\u002Fdiv>\n<div><h3 style=\"margin: 0; font-weight: 600; font-size: 16px\">Primeira sessão<\u002Fh3><p style=\"margin: 4px 0 0; font-size: 15px\">Conversamos sobre sua história, sua perda e o que fez você buscar apoio.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #fbf8f4; border: 1px solid #e3d9cd; border-radius: 18px; padding: 24px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"flex: none; width: 56px; height: 56px; border-radius: 14px; background: #a8b89e; color: #2f3b3b; display: flex; align-items: center; justify-content: center; font-weight: 200; font-size: 26px\">03<\u002Fdiv>\n<div><h3 style=\"margin: 0; font-weight: 600; font-size: 16px\">Acompanhamento<\u002Fh3><p style=\"margin: 4px 0 0; font-size: 15px\">Sessões individuais de [50 minutos], no seu ritmo e com sigilo.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px clamp(64px, 8vw, 110px); box-sizing: border-box\">\n<div style=\"max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.15\">Não é preciso ter as <strong style=\"font-weight: 800\">palavras certas<\u002Fstrong>.<\u002Fh2>\n<p style=\"margin: 0\">Se esta for sua primeira vez na terapia, é normal não saber por onde começar. Você pode chegar com silêncio, com choro ou com dúvidas. A primeira conversa também serve para nos conhecermos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contato\" style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 64px; box-sizing: border-box\">\n<div style=\"background: #516d75; color: #f6f1eb; border-radius: 28px; position: relative; overflow: hidden\">\n<div class=\"linhas\" aria-hidden=\"true\" style=\"position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0.22\"><\u002Fdiv>\n<div style=\"position: relative; padding: clamp(40px, 6vw, 80px) clamp(24px, 5vw, 72px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: center\">\n<div style=\"flex: 999 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-weight: 200; font-size: clamp(30px, 3.8vw, 50px); line-height: 1.12\">No luto, encontramos <strong style=\"font-weight: 800\">força<\u002Fstrong>.<\u002Fh2>\n<p style=\"margin: 0; max-width: 460px\">Chegar até aqui já é um passo. Escreva quando se sentir à vontade.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; max-width: 400px; display: flex; flex-direction: column; gap: 14px; font-size: 16px\">\n<div style=\"font-weight: 600\">Formas de contato<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#dfe6da\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z\"><\u002Fpath><\u002Fsvg><span><strong style=\"font-weight: 600\">WhatsApp:<\u002Fstrong> [(00) 00000-0000]<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#dfe6da\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><rect x=\"3.5\" y=\"5.5\" width=\"17\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M4 7l8 6 8-6\"><\u002Fpath><\u002Fsvg><span><strong style=\"font-weight: 600\">E-mail:<\u002Fstrong> [E-MAIL]<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#dfe6da\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0
